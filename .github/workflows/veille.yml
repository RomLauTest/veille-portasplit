name: Veille PortaSplit

# Surveille le stock sur l'infrastructure GitHub (gratuit), sans avoir besoin
# de laisser un PC allume.
#
# ---------------------------------------------------------------------------
# VEILLE EN PAUSE (06/08/2026)
#
# La veille automatique est desactivee : le bloc "schedule" ci-dessous est mis
# en commentaire. Plus aucune execution automatique, donc plus de notifications
# ni de mails d'echec. Toute la configuration est conservee telle quelle.
#
# POUR REACTIVER : enlever les "#" devant les 2 lignes "schedule" / "- cron"
# ci-dessous, puis pousser sur la branche par defaut (main). C'est tout : les
# secrets (NTFY_TOPIC, etc.) et le reste du workflow sont inchanges.
#
# A savoir en reactivant : malgre le cron toutes les 30 min, GitHub met les
# workflows planifies en file basse priorite. Les executions reelles etaient
# espacees de 1h a 3h20 (mediane ~2h). Pour une vraie cadence de 30 min il
# faut un declencheur externe qui appelle l'API GitHub (workflow_dispatch /
# repository_dispatch ne sont pas deprioritises).
# ---------------------------------------------------------------------------

on:
  # schedule:
  #   - cron: "*/30 * * * *"   # toutes les 30 minutes (heure UTC)

  # Reste disponible : permet de lancer la veille a la main, ponctuellement,
  # depuis l'onglet "Actions" > "Veille PortaSplit" > "Run workflow".
  workflow_dispatch:

# Necessaire pour que le job puisse re-commiter etat_stock.json (la memoire).
permissions:
  contents: write

# Evite que deux executions se chevauchent.
concurrency:
  group: veille-portasplit
  cancel-in-progress: false

jobs:
  verifier-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Installer Chromium (Playwright)
        run: python -m playwright install --with-deps chromium

      - name: Lancer la veille
        env:
          # Topic ntfy fourni via un secret GitHub (jamais ecrit dans le code).
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Optionnels :
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_PRIORITY: ${{ secrets.NTFY_PRIORITY }}
        run: python monitor_stock.py --playwright

      - name: Memoriser l'etat (commit de etat_stock.json)
        if: always()   # on sauvegarde meme si une etape precedente a echoue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add etat_stock.json
          # Ne commite que s'il y a un changement reel.
          if git diff --cached --quiet; then
            echo "Aucun changement d'etat a sauvegarder."
          else
            git commit -m "maj etat stock [skip ci]"
            git push
          fi
